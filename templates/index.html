<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">
  <header>⚡ PokéBoard ⚡</header>

  <div class="main">
    <!-- ── LOBBY ── -->
    <div id="lobby">
      <div class="lobby-card">
        <h2>เริ่มเล่น PokéBoard</h2>
        <div class="form-group">
          <label>ชื่อผู้เล่น</label>
          <input id="inp-name" type="text" placeholder="กรอกชื่อ..." maxlength="20">
        </div>

        <div class="btn-group">
          <button class="btn btn-primary" onclick="createRoom()">🏠 สร้างห้อง</button>
        </div>

        <div class="divider">หรือเข้าห้องที่มีอยู่</div>

        <div class="form-group">
          <label>Room ID</label>
          <input id="inp-room" type="text" placeholder="เช่น AB12CD" maxlength="6" style="text-transform:uppercase">
        </div>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="joinRoom()">🚪 เข้าร่วม</button>
        </div>

        <div id="lobby-msg" style="margin-top:12px;font-size:.85rem;color:#c00;"></div>
      </div>
    </div>

    <!-- ── WAITING ROOM ── -->
    <div id="waiting" class="hidden" style="flex:1;display:flex;align-items:center;justify-content:center;">
      <div class="lobby-card">
        <h2>🏠 ห้องรอ</h2>
        <p style="margin-bottom:12px;">Room ID: <strong id="disp-room-id" style="font-size:1.3rem;color:var(--red)">—</strong></p>
        <p style="margin-bottom:12px;font-size:.85rem;color:#666;">แชร์ Room ID ให้เพื่อนเข้าร่วม (ต้องการ 2–4 คน)</p>
        <div id="wr-class-picker" style="margin-bottom:12px;padding:10px;background:#f9f9f9;border-radius:8px;border:1px solid #eee;"></div>
        <div id="waiting-players" style="margin-bottom:16px;"></div>
        <div id="start-btn-wrap" class="hidden">
          <button class="btn btn-primary" onclick="startGame()">▶ เริ่มเกม!</button>
        </div>
        <p id="waiting-hint" style="font-size:.8rem;color:#888;margin-top:8px;"></p>
      </div>
    </div>

    <!-- ── GAME ── -->
    <div id="game" class="hidden">
      <div class="board-wrap">
        <div class="board-grid" id="board-grid">
          <div class="board-center">
            <div class="room-info">🎮 Room: <span id="gc-room-id">—</span></div>
            <div class="turn-info">เทิร์นของ</div>
            <div class="turn-player" id="gc-turn-player">—</div>
          </div>
        </div>
      </div>

      <!-- floating player cards (top-right) -->
      <div class="players-wrap" id="players-wrap"></div>

      <!-- side action panel (between right player cards) -->
      <div id="side-btns" class="side-btns hidden">
        <button class="btn btn-primary btn-sm hidden" id="btn-roll" onclick="doRoll()">🎲 ทอย</button>
        <button class="btn btn-secondary btn-sm" id="btn-bag" onclick="showUseItemModal()">🎒 กระเป๋า</button>
        <button class="btn btn-warning btn-sm" id="btn-ability" onclick="showAbilityModal()">⚡ ความสามารถ</button>
      </div>

      <!-- floating log (bottom-center) -->
      <div class="log-panel" id="log-panel"></div>

      <!-- action bar (bottom) -->
      <div class="action-bar">
        <div class="action-bar-left"></div>
        <div id="action-pokemon-info" class="action-pokemon-info" style="display:none;"></div>
        <div class="action-bar-center">
          <span class="action-bar-title" id="action-title">รอการทอยเต๋า...</span>
          <div class="action-btns" id="action-btns"></div>
        </div>
        <div class="action-bar-right">
          <button class="btn btn-danger btn-sm hidden" id="btn-end-game" onclick="doEndGame()">🏁 จบเกม</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── ACTION MODAL ── -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">—</h2>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

<!-- ── DICE OVERLAY (content injected by JS) ── -->
<div id="dice-overlay" class="hidden"></div>

<!-- ── BATTLE SCREEN ── -->
<div id="battle-overlay" class="hidden">
  <div class="ba-screen">
    <!-- Arena: sky + ground, 4 absolutely positioned elements -->
    <div class="ba-arena">
      <!-- Enemy HP box (top-left) -->
      <div class="ba-hpbox ba-hpbox-enemy">
        <div class="ba-hp-name" id="ba-enemy-name">—</div>
        <div class="ba-hp-atk" id="ba-enemy-atk">ATK —</div>
        <div class="ba-hp-track"><div class="ba-hp-fill" id="ba-enemy-hp-fill"></div></div>
      </div>
      <!-- Enemy sprite (top-right, front-facing) -->
      <div class="ba-sprite-wrap ba-enemy-sprite" id="battle-defender"></div>
      <!-- Player sprite (bottom-left, back-facing) -->
      <div class="ba-sprite-wrap ba-player-sprite" id="battle-attacker"></div>
      <!-- Player HP box (bottom-right) -->
      <div class="ba-hpbox ba-hpbox-player">
        <div class="ba-hp-name" id="ba-player-name">—</div>
        <div class="ba-hp-atk" id="ba-player-atk">ATK —</div>
        <div class="ba-hp-track"><div class="ba-hp-fill" id="ba-player-hp-fill"></div></div>
        <div class="ba-hp-num" id="ba-player-hp-num">— / —</div>
      </div>
    </div>
    <!-- Bottom: dialogue box + action menu -->
    <div class="ba-bottom">
      <div class="ba-dialogue">
        <div class="ba-log" id="battle-log"></div>
        <div class="ba-status" id="battle-status"></div>
      </div>
      <div class="ba-actions">
        <button class="ba-btn-fight hidden" id="btn-battle-roll" onclick="doBattleRoll()">FIGHT</button>
        <button class="ba-btn-run hidden" id="btn-battle-surrender" onclick="doBattleSurrender()">RUN</button>
      </div>
    </div>
  </div>
</div>

<!-- ── WILD ENCOUNTER NOTIF (non-catcher view) ── -->
<div class="hidden" id="wild-notif"></div>

<!-- ── EVENT CARD ── -->
<div class="hidden" id="event-card-overlay"></div>

<!-- ── EVOLUTION ANIMATION ── -->
<div id="evo-overlay" class="hidden"></div>

<!-- ── GAME OVER ── -->
<div class="game-over-overlay hidden" id="gameover-overlay">
  <div class="game-over-card">
    <h1>🏆 เกมจบแล้ว!</h1>
    <ul class="ranking-list" id="ranking-list"></ul>
    <button class="btn btn-primary" onclick="location.reload()">เล่นใหม่</button>
  </div>
</div>

<!-- data passed from server -->
<script>
  window.CLASSES_DATA = {{ classes | tojson }};
  window.ITEMS_DATA   = {{ items  | tojson }};
</script>
<script>
  // Preload board from server-rendered data
  fetch("/api/board").then(r => r.json()).then(d => {
    window.BOARD_DATA = d;
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/board.js"></script>
<script src="/static/js/socket.js"></script>
</body>
</html>
